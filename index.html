
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Music Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="music-player">
    <img src="images/fairouz.jpg" alt="Fairouz" class="artist-image" />
    <h2 class="artist-name"><b>Fairouz</b></h2>
    <h3 id="song-title" class="song-title">Kifak Inta</h3>

    
    <audio id="audio-player" controls>
      <source src="songs/kifak_inta.mp3.mp3 Inta.mp3" type="audio/mp3" />
    </audio>

    
   <div class="controls">
  <button id="prev-btn">⏮️</button>
  <button id="next-btn">⏭️</button>
</div>

  <script src="script.js"></script>
</body>
</html>
